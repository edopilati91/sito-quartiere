version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only. Remove once it supports 7.
      - dependency-name: "typescript"
        versions: [">=7"]
